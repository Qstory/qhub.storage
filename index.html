<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>숫자 맞추기 게임</title>
    <style>
        body { text-align: center; font-family: sans-serif; margin-top: 50px; background-color: #f0f2f5; }
        .card { background: white; padding: 20px; border-radius: 10px; display: inline-block; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input { padding: 8px; font-size: 16px; width: 100px; text-align: center; }
        button { padding: 8px 16px; font-size: 16px; cursor: pointer; background-color: #2ea44f; color: white; border: none; border-radius: 5px; }
        p { font-size: 18px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🎯 숫자 맞추기 게임</h1>
        <p>1부터 10 사이의 숫자를 맞춰보세요!</p>
        <input type="number" id="guess" min="1" max="10">
        <button onclick="checkGuess()">확인</button>
        <p id="result" style="color: #333; margin-top: 20px;"></p>
    </div>

    <script>
        const answer = Math.floor(Math.random() * 10) + 1;
        function checkGuess() {
            const userGuess = Number(document.getElementById('guess').value);
            const result = document.getElementById('result');
            if (userGuess === answer) {
                result.style.color = "green";
                result.innerText = "🎉 정답입니다! 축하해요!";
            } else if (userGuess < answer) {
                result.style.color = "blue";
                result.innerText = "📈 업(UP)! 더 큰 숫자예요.";
            } else {
                result.style.color = "red";
                result.innerText = "📉 다운(DOWN)! 더 작은 숫자예요.";
            }
        }
    </script>
</body>
</html>
